{% extends "base.html" %}
{% block title %}Video editing{% endblock %}
{% block content %}
<div class="card">
    <h1>Video editing</h1>
    <p>Формат операций: одна строка = <code>start|end|prompt</code></p>
    <form action="/cabinet/video-editing" method="post" enctype="multipart/form-data">
        <select name="model_id" required>
            <option value="">Выберите модель</option>
            {% for model in models %}
                <option value="{{ model.model_id.value }}">{{ model.name }}</option>
            {% endfor %}
        </select>
        <textarea name="prompt_text" rows="4" placeholder="Общий prompt" required>{{ prompt_text or '' }}</textarea>
        <textarea name="operations_text" rows="6" placeholder="0|5|Сделать сцену темнее&#10;10|15|Изменить внешний вид персонажа">{{ operations_text or '' }}</textarea>
        <input type="file" name="file" accept="video/*" required>
        <button class="primary" type="submit">Запустить</button>
    </form>
</div>
{% endblock %}

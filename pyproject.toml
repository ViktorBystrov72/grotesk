[project]
name = "grotesk"
version = "0.7.0"
description = "ML media service"
requires-python = ">=3.12"
dependencies = [
    "accelerate",
    "aio-pika",
    "aiogram",
    "aiosqlite",
    "asyncpg",
    "bcrypt",
    "diffusers @ git+https://github.com/huggingface/diffusers.git",
    "fastapi",
    "ffmpeg-python",
    "greenlet",
    "httpx",
    "itsdangerous",
    "jinja2",
    "pydantic",
    "python-multipart",
    "safetensors",
    "scikit-learn",
    "silero-vad",
    "soundfile",
    "sqlalchemy",
    "speechbrain",
    "sentencepiece",
    "torch",
    "torchaudio",
    "opencv-python-headless",
    "transformers",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/grotesk --cov-report=term-missing"
filterwarnings = [
    "ignore:'crypt' is deprecated and slated for removal in Python 3\\.13:DeprecationWarning",
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["src/grotesk"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[project]
name = "grotesk"
version = "0.4.0"
description = "ML media service"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy",
    "asyncpg",
    "aiosqlite",
    "fastapi",
    "uvicorn",
    "pydantic",
    "aiogram",
    "httpx",
    "passlib",
    "bcrypt",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file:
      - .env
    environment:
      MESSAGING_BACKEND: rabbitmq
      MEDIA_STORAGE_ROOT: /media
      PYTHONPATH: /workspace/src:/app/src
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-grotesk}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-grotesk}
    volumes:
      - ./app/src:/app/src
      - ./src:/workspace/src
      - media_data:/media
    depends_on:
      - rabbitmq
      - database

  worker:
    build:
      context: .
      dockerfile: app/Worker.Dockerfile
    env_file:
      - .env
    environment:
      HF_HOME: /models/hf
      MESSAGING_BACKEND: rabbitmq
      MEDIA_STORAGE_ROOT: /media
      RESULT_ARTIFACT_ROOT: /media/results
      PYTHONPATH: /workspace/src:/app/src
      # python-slim image has no CUDA; keep CPU (overrides .env HF_DEVICE for this service).
      HF_DEVICE: cpu
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-grotesk}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-grotesk}
    command: ["python", "/app/src/worker.py"]
    volumes:
      - ./app/src:/app/src
      - ./src:/workspace/src
      - media_data:/media
      - hf_cache:/models/hf
    depends_on:
      - rabbitmq
      - database

  web-proxy:
    build: ./web-proxy
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"

  rabbitmq:
    image: rabbitmq:3-management
    restart: on-failure
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-grotesk}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-grotesk}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  hf_cache:
  media_data:
  rabbitmq_data:
  postgres_data:

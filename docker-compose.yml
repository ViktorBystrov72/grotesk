services:
  model-preload:
    build:
      context: .
      dockerfile: app/Worker.Dockerfile
    env_file:
      - .env
    environment:
      HF_HOME: /models/hf
      HF_HUB_CACHE: /models/hf/hub
      HUGGINGFACE_HUB_CACHE: /models/hf/hub
      TRANSFORMERS_CACHE: /models/hf/transformers
      TORCH_HOME: /models/hf/torch
      HF_TOKEN: ${HF_TOK}
      PYTHONPATH: /workspace/src:/app/src
    command: ["python", "/app/src/preload_models.py"]
    volumes:
      - ./app/src:/app/src
      - ./src:/workspace/src
      - hf_cache:/models/hf

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file:
      - .env
    environment:
      MESSAGING_BACKEND: rabbitmq
      MEDIA_STORAGE_ROOT: /media
      PYTHONPATH: /workspace/src:/app/src
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-grotesk}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-grotesk}
    volumes:
      - ./alembic:/workspace/alembic
      - ./alembic.ini:/workspace/alembic.ini
      - ./app/src:/app/src
      - ./src:/workspace/src
      - media_data:/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
      database:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file:
      - .env
    environment:
      MEDIA_STORAGE_ROOT: /media
      PYTHONPATH: /workspace/src:/app/src
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-grotesk}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-grotesk}
    command: ["python", "-m", "grotesk.infrastructure.db.migrate"]
    volumes:
      - ./alembic:/workspace/alembic
      - ./alembic.ini:/workspace/alembic.ini
      - ./app/src:/app/src
      - ./src:/workspace/src
      - media_data:/media
    depends_on:
      database:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: app/Worker.Dockerfile
    env_file:
      - .env
    environment:
      HF_HOME: /models/hf
      HF_HUB_CACHE: /models/hf/hub
      HUGGINGFACE_HUB_CACHE: /models/hf/hub
      TRANSFORMERS_CACHE: /models/hf/transformers
      TORCH_HOME: /models/hf/torch
      HF_TOKEN: ${HF_TOK}
      MESSAGING_BACKEND: rabbitmq
      MEDIA_STORAGE_ROOT: /media
      RESULT_ARTIFACT_ROOT: /media/results
      PYTHONPATH: /workspace/src:/app/src
      # python-slim image has no CUDA; keep CPU (overrides .env HF_DEVICE for this service).
      HF_DEVICE: cpu
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-grotesk}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-grotesk}
      HF_VIDEO_NUM_INFERENCE_STEPS: "1"
      HF_VIDEO_WIDTH: "320"
      HF_VIDEO_HEIGHT: "192"
      HF_VIDEO_FPS: "12"
      HF_VIDEO_MAX_FRAMES: "9"
      HF_VIDEO_GUIDANCE_SCALE: "3.0"
      HF_VIDEO_TEMPORAL_ALIGN: "4"
      HF_VIDEO_PROGRESS_INTERVAL_SEC: "10"
    command: ["python", "/app/src/worker.py"]
    volumes:
      - ./alembic:/workspace/alembic
      - ./alembic.ini:/workspace/alembic.ini
      - ./app/src:/app/src
      - ./src:/workspace/src
      - media_data:/media
      - hf_cache:/models/hf
    depends_on:
      model-preload:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web-proxy:
    build: ./web-proxy
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"

  rabbitmq:
    image: rabbitmq:3-management
    restart: on-failure
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-grotesk}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-grotesk}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  database:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${GROTESK_DB_PORT_PUBLISH:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  hf_cache:
  media_data:
  rabbitmq_data:
  postgres_data:
